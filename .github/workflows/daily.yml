name: Daily AI Brief

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00；00:30 为备份（若 00:00 未触发或失败）
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check today's brief
        id: check
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -f "reports/brief-$TODAY.json" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天的晨报已存在，跳过（备份触发）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate & push brief
        if: steps.check.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python brief.py

      - name: Build website
        if: steps.check.outputs.skip != 'true'
        run: python3 build_site.py

      - name: Commit reports & site
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/ data/
          if ! git diff --cached --quiet; then
            git commit -m "brief: $(date -u +%F)"
            git push
          else
            echo "no changes"
          fi
